[project]
name = "rill"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.7",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "prometheus-client>=0.26.0",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "transformers>=5.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: needs Qwen/Qwen3-0.6B in the local HF cache (skipped otherwise)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "N812", "PT018"]  # non-ASCII text ok; `import ... as F` is the torch idiom

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
# torch's nn.Module.__call__ returns Any, so every `return self.proj(x)` would be flagged.
warn_return_any = false
files = ["rill", "benchmarks", "tests"]

[[tool.mypy.overrides]]
module = ["safetensors.*", "transformers.*", "hypothesis.*", "prometheus_client.*", "tokenizers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# safetensors' safe_open handle and transformers models are untyped
module = ["rill.loader", "tests.*", "benchmarks.*"]
disallow_untyped_calls = false

# Linux (Docker, CI) gets CPU-only torch wheels; macOS keeps the PyPI wheel (with MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
